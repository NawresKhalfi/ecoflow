# Tâches de nuit sans offre Blaze : sauvegarde de Firestore (US-132), puis
# purge des photos expirées (US-021) et expiration des EcoPoints (US-078).
# Exporte la base avec un compte administrateur, teste la restauration sur
# l'émulateur, puis conserve l'archive CHIFFRÉE 30 jours (artefact).
#
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   ECOFLOW_BACKUP_EMAIL, ECOFLOW_BACKUP_PASSWORD  compte administrateur dédié
#   ECOFLOW_BACKUP_PASSPHRASE                      phrase de chiffrement de l'archive
# Déchiffrer : openssl enc -d -aes-256-cbc -pbkdf2 -in backup.tar.gz.enc | tar xz
name: Sauvegarde et maintenance de nuit

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - name: Export
        env:
          ECOFLOW_BACKUP_EMAIL: ${{ secrets.ECOFLOW_BACKUP_EMAIL }}
          ECOFLOW_BACKUP_PASSWORD: ${{ secrets.ECOFLOW_BACKUP_PASSWORD }}
        run: python3 tool/backup.py export backups/latest
      - name: Restauration testée sur l'émulateur
        run: >
          firebase emulators:exec --only auth,firestore --project meteo-ba45f
          "python3 tool/backup.py restore backups/latest && python3 tool/backup.py verify backups/latest"
      - name: Archive chiffrée
        env:
          PASSPHRASE: ${{ secrets.ECOFLOW_BACKUP_PASSPHRASE }}
        run: |
          tar czf - -C backups latest |
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASSPHRASE -out backup.tar.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: ecoflow-backup-${{ github.run_number }}
          path: backup.tar.gz.enc
          retention-days: 30
      - name: Maintenance (purge des photos, expiration des points)
        env:
          ECOFLOW_BACKUP_EMAIL: ${{ secrets.ECOFLOW_BACKUP_EMAIL }}
          ECOFLOW_BACKUP_PASSWORD: ${{ secrets.ECOFLOW_BACKUP_PASSWORD }}
        run: python3 tool/maintenance.py
