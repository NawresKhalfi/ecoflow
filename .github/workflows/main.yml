# Intégration continue EcoFlow (US-130) : à chaque push et pull request.
#  - qualité : format, analyse statique, tests unitaires et widgets, couverture ≥ 75 %
#  - sécurité : sonde des règles Firestore contre l'émulateur (projet demo, hors ligne)
#  - builds : Android (APK debug) et iOS (sans signature) — US-128
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.6

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format (100 colonnes)
        run: dart format --page-width 100 --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart')
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Couverture minimale
        run: python3 tool/coverage_check.py 75
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  rules:
    name: Règles Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g firebase-tools
      - name: Sonde contre l'émulateur
        run: >
          firebase emulators:exec --only auth,firestore --project demo-ecoflow
          "FIREBASE_PROJECT=demo-ecoflow python3 tool/firestore_rules_probe.py
          && FIREBASE_PROJECT=demo-ecoflow python3 tool/maintenance_test.py"

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ecoflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --debug --no-codesign
