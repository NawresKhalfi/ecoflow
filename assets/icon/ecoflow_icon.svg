<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="felt" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4E33C"/>
      <stop offset="1" stop-color="#93C925"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF7DD"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#3D6B12" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- anses -->
    <path d="M318 380 C318 250 348 228 398 228 C448 228 478 250 478 380" fill="none" stroke="#86BC1E" stroke-width="50" stroke-linecap="round"/>
    <path d="M318 380 C318 250 348 228 398 228 C448 228 478 250 478 380" fill="none" stroke="#A6D932" stroke-width="34" stroke-linecap="round"/>
    <path d="M546 380 C546 250 576 228 626 228 C676 228 706 250 706 380" fill="none" stroke="#86BC1E" stroke-width="50" stroke-linecap="round"/>
    <path d="M546 380 C546 250 576 228 626 228 C676 228 706 250 706 380" fill="none" stroke="#A6D932" stroke-width="34" stroke-linecap="round"/>
    <!-- sac -->
    <path d="M262 372 Q262 352 284 352 L740 352 Q762 352 762 372 L786 784 Q788 826 746 826 L278 826 Q236 826 238 784 Z" fill="url(#body)" filter="url(#felt)"/>
    <path d="M262 372 Q262 352 284 352 L740 352 Q762 352 762 372 L786 784 Q788 826 746 826 L278 826 Q236 826 238 784 Z" fill="none" stroke="#7FB21C" stroke-width="8" stroke-dasharray="2 16" stroke-linecap="round" opacity="0.7" transform="translate(512 589) scale(0.94) translate(-512 -589)"/>
  </g>
  <!-- pousse -->
  <path d="M512 588 L512 470" stroke="#2F8F2A" stroke-width="22" stroke-linecap="round"/>
  <path d="M512 492 C470 430 400 420 352 446 C376 506 446 524 512 492 Z" fill="#2F8F2A"/>
  <path d="M512 470 C548 400 626 382 684 410 C656 482 578 504 512 470 Z" fill="#2F8F2A"/>
  <!-- texte -->
  <text x="512" y="728" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Rounded Bold, Arial" font-weight="bold" font-size="168" fill="#FFFFFF" letter-spacing="2">eco</text>
</svg>
