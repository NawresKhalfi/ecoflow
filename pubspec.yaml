name: ecoflow
description: "EcoFlow – citoyens, collecteurs et recycleurs réunis."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.1
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf

