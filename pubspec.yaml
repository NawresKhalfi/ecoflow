name: ecoflow
description: "EcoFlow – citoyens, collecteurs et recycleurs réunis."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  archive: ">=4.0.0 <4.1.0"
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_reactive_ble: ^5.4.2
  flutter_riverpod: ^3.3.2
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  pdf: ^3.11.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  ultralytics_yolo: ^0.6.15
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/waste_yolov8m.mlpackage.zip
    - assets/models/waste_yolov8m.tflite
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf

